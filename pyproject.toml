[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upsampler"
version = "0.1.0"
description = "Deep-learning image upsampling CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "Pillow>=10.0.0",
  "torch>=2.1.0",
  "transformers>=4.39.0",
  "torchvision"
]

[project.scripts]
upsample = "upsampler.cli:main"

[tool.setuptools.packages.find]
include = ["upsampler*"]
